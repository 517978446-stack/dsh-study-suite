name: 双平台冒烟

on:
  push:
  pull_request:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装服务依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install ctranslate2 sentencepiece pypdf python-docx
      - name: 服务能否启动（不加载模型）
        run: python dev/smoke-ci.py
