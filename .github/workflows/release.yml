name: release

# 打 tag（v*）时自动建 Release，并把 packages/ 下的 zip 传成资产。
# 这样下载计数、版本页这些元信息就有了，也不用本地 token。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查脚本编码
        run: python3 dev/check-encoding.py .

      - name: 构建安装包（仓库里不存二进制）
        env:
          VERSION: ${{ github.ref_name }}   # 形如 v7.13.1
        run: |
          set -e
          VERSION="${VERSION#v}" ./dev/pack.sh
          ls -lh packages/*.zip
          test "$(ls packages/*.zip | wc -l)" -ge 2

      - name: 发布前确认包内没有个人信息
        run: python3 dev/check-privacy.py packages/*.zip

      - name: 建 Release 并上传资产
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${GITHUB_REF#refs/tags/}"
          # 已存在就补传（--clobber 覆盖同名资产），避免重复触发时失败
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" packages/*.zip --clobber
          else
            gh release create "$TAG" packages/*.zip \
              --title "$TAG" \
              --generate-notes
          fi
